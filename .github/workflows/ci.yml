name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest

      - name: Replay empty CI database
        env:
          GENUS_DB_PATH: ${{ runner.temp }}/genus-ci.sqlite3
        run: genus replay

      - name: Check integrity
        env:
          GENUS_DB_PATH: ${{ runner.temp }}/genus-ci.sqlite3
        run: genus integrity check

      - name: Initialize ledger sealing
        env:
          GENUS_DB_PATH: ${{ runner.temp }}/genus-ci.sqlite3
        run: genus ledger seal-init

      - name: Show ledger head
        env:
          GENUS_DB_PATH: ${{ runner.temp }}/genus-ci.sqlite3
        run: genus ledger head

      - name: Verify ledger seal chain
        env:
          GENUS_DB_PATH: ${{ runner.temp }}/genus-ci.sqlite3
        run: genus ledger verify

      - name: Create offline ledger anchor
        env:
          GENUS_DB_PATH: ${{ runner.temp }}/genus-ci.sqlite3
          GENUS_CORE_ID: ci-core
        run: genus ledger anchor create --out ${{ runner.temp }}/genus-anchor.json

      - name: Verify offline ledger anchor
        env:
          GENUS_DB_PATH: ${{ runner.temp }}/genus-ci.sqlite3
          GENUS_CORE_ID: ci-core
        run: genus ledger anchor verify ${{ runner.temp }}/genus-anchor.json

      - name: Check integrity after sealing
        env:
          GENUS_DB_PATH: ${{ runner.temp }}/genus-ci.sqlite3
        run: genus integrity check

      - name: Run doctor
        env:
          GENUS_DB_PATH: ${{ runner.temp }}/genus-ci.sqlite3
          GENUS_CORE_ID: ci-core
        run: genus doctor

      - name: Record operation check
        env:
          GENUS_DB_PATH: ${{ runner.temp }}/genus-ci.sqlite3
        run: genus operation network-check --status ok --target ci-gateway

      - name: Check integrity after operation check
        env:
          GENUS_DB_PATH: ${{ runner.temp }}/genus-ci.sqlite3
        run: genus integrity check

      - name: Guard forbidden model imports
        run: |
          ! grep -R -n -E --include='*.py' "anthropic|openai|ollama" genus

      - name: Guard forbidden network imports
        run: |
          ! grep -R -n -E --include='*.py' "requests|httpx|aiohttp|urllib\.request" genus
