name: CI

on:
  push:
    branches: ["main", "codex/a03c-polkit-staging"]
  pull_request:
    branches: ["main"]

jobs:
  a03c-polkit-staging:
    name: A0.3c disposable systemd/Polkit evidence
    if: github.ref == 'refs/heads/codex/a03c-polkit-staging'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out candidate
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Prepare disposable systemd and Polkit runner
        run: |
          test "$(cat /proc/1/comm)" = systemd
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes policykit-1
          sudo systemctl start polkit.service
          sudo systemctl is-active --quiet polkit.service
          python -m pip install --disable-pip-version-check pytest

      - name: Prove fail-closed concrete-unit authority detection
        env:
          GENUS_A03C_DISPOSABLE_SYSTEMD_POLKIT_STAGING: I_UNDERSTAND_THIS_IS_A_DISPOSABLE_VM
        run: |
          python_bin="$(command -v python)"
          log="$RUNNER_TEMP/a03c-polkit-staging.log"
          set +e
          sudo env \
            GENUS_A03C_DISPOSABLE_SYSTEMD_POLKIT_STAGING="$GENUS_A03C_DISPOSABLE_SYSTEMD_POLKIT_STAGING" \
            "$python_bin" -m pytest -vv -s --tb=short --noconftest \
            --rootdir "$GITHUB_WORKSPACE" \
            "$GITHUB_WORKSPACE/tests/test_a0_3c_workload_self_probe_staging.py" 2>&1 | tee "$log"
          status="${PIPESTATUS[0]}"
          set -e
          if [ "$status" -ne 0 ]; then
            message="$(python -c 'import pathlib,sys; text=pathlib.Path(sys.argv[1]).read_text(errors="replace")[-6000:]; print(text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))' "$log")"
            printf '::error title=A0.3c disposable Polkit staging failed::%s\n' "$message"
            exit "$status"
          fi

      - name: Prove staging cleanup
        if: always()
        run: |
          test ! -e /usr/local/libexec/genus-a0-3c-boot-guard
          test ! -e /etc/polkit-1/rules.d/49-genus-a03c-self-probe-staging.rules
          for unit in genus-learner.service genus-telegram-bot.service genus-backup.service 'genus-cron@.service'; do
            test ! -e "/run/systemd/system/$unit"
          done
          for user in genus-runtime genus-telegram genus-backup; do
            ! getent passwd "$user"
          done
          for group in genus-data genus-runtime genus-telegram genus-backup; do
            ! getent group "$group"
          done

  test:
    name: Python ${{ matrix.python-version }}
    if: github.ref != 'refs/heads/codex/a03c-polkit-staging'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package
        run: |
          python -m pip install --upgrade pip "setuptools>=83"
          python -m pip install -e ".[dev]"

      - name: Static correctness and dependency consistency
        run: |
          python -m compileall -q genus deploy experiments
          ruff check genus deploy experiments tests
          python -m pip check

      - name: Validate deployment shell syntax
        run: bash -n deploy/*.sh

      - name: Audit Python dependencies
        run: pip-audit --local --skip-editable

      - name: Run tests
        run: python -m pytest

      - name: Provision explicit current-schema CI database
        env:
          GENUS_DB_PATH: ${{ runner.temp }}/genus-ci.sqlite3
        run: python -c "import os; from genus import db; c = db.connect(os.environ['GENUS_DB_PATH']); c.close()"

      - name: Replay empty CI database
        env:
          GENUS_DB_PATH: ${{ runner.temp }}/genus-ci.sqlite3
        run: genus replay

      - name: Check integrity
        env:
          GENUS_DB_PATH: ${{ runner.temp }}/genus-ci.sqlite3
        run: genus integrity check

      - name: Initialize ledger sealing
        env:
          GENUS_DB_PATH: ${{ runner.temp }}/genus-ci.sqlite3
        run: genus ledger seal-init

      - name: Show ledger head
        env:
          GENUS_DB_PATH: ${{ runner.temp }}/genus-ci.sqlite3
        run: genus ledger head

      - name: Verify ledger seal chain
        env:
          GENUS_DB_PATH: ${{ runner.temp }}/genus-ci.sqlite3
        run: genus ledger verify

      - name: Create offline ledger anchor
        env:
          GENUS_DB_PATH: ${{ runner.temp }}/genus-ci.sqlite3
          GENUS_CORE_ID: ci-core
        run: genus ledger anchor create --out ${{ runner.temp }}/genus-anchor.json

      - name: Verify offline ledger anchor
        env:
          GENUS_DB_PATH: ${{ runner.temp }}/genus-ci.sqlite3
          GENUS_CORE_ID: ci-core
        run: genus ledger anchor verify ${{ runner.temp }}/genus-anchor.json

      - name: Check integrity after sealing
        env:
          GENUS_DB_PATH: ${{ runner.temp }}/genus-ci.sqlite3
        run: genus integrity check

      - name: Run doctor
        env:
          GENUS_DB_PATH: ${{ runner.temp }}/genus-ci.sqlite3
          GENUS_CORE_ID: ci-core
        run: genus doctor

      - name: Record operation check
        env:
          GENUS_DB_PATH: ${{ runner.temp }}/genus-ci.sqlite3
        run: genus operation network-check --status ok --target ci-gateway

      - name: Check integrity after operation check
        env:
          GENUS_DB_PATH: ${{ runner.temp }}/genus-ci.sqlite3
        run: genus integrity check

      - name: Guard core membrane imports
        run: python -m pytest -q tests/test_membrane_purity.py
