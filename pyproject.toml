[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genus-pi-seed"
version = "1.15.0"
description = "GENUS PI SEED v1.15.0 - the knowledge graph woven into the core's epistemic loops (relation confidence, knowledge contradiction->surprise->teacher-loop, calibration + governed acquisition) plus a cadence-robustness fix, on the self-reflecting 24/7-learning deterministic core"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
]

[project.scripts]
genus = "genus.cli:main"

[tool.setuptools]
packages = ["genus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error",
    # GC-timing noise: a file-backed sqlite connection finalized during garbage collection
    # emits an "unclosed database" ResourceWarning that pytest reports as an unraisable
    # exception. It is test-cleanup hygiene, not a product bug, and surfaces non-
    # deterministically (which test is running at GC time) -- so don't escalate it to a
    # hard failure. Everything else stays warnings-as-errors.
    "ignore::pytest.PytestUnraisableExceptionWarning",
]
