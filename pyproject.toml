[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genus-pi-seed"
version = "0.7.0"
description = "GENUS PI SEED v0.7 query layer"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
genus = "genus.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
