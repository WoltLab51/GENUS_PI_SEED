[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "genus-pi-seed"
version = "1.17.0"
description = "GENUS: local, event-sourced and provenance-first epistemic core with a bounded companion runtime for Raspberry Pi"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "psutil>=5.9",
    "sympy>=1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
    "ruff>=0.5",
    "pip-audit>=2.7",
]

[project.scripts]
genus = "genus.cli:main"

[tool.setuptools]
packages = ["genus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error",
    # GC-timing noise: a file-backed sqlite connection finalized during garbage collection
    # emits an "unclosed database" ResourceWarning that pytest reports as an unraisable
    # exception. It is test-cleanup hygiene, not a product bug, and surfaces non-
    # deterministically (which test is running at GC time) -- so don't escalate it to a
    # hard failure. Everything else stays warnings-as-errors.
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Correctness first: syntax, undefined names and invalid control flow. Broader style
# normalization belongs to the gradual module split, not this operational hardening.
select = ["E9", "F63", "F7", "F82"]
