[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genus-pi-seed"
version = "1.2.7"
description = "GENUS PI SEED v1.2.7 normalize remote setup script line endings"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
]

[project.scripts]
genus = "genus.cli:main"

[tool.setuptools]
packages = ["genus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
