[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genus-pi-seed"
version = "1.16.0"
description = "GENUS PI SEED v1.16.0 - multilingual knowledge acquisition (Wikidata Lexemes + German Wiktionary via DBnary), the sense->concept bridge that makes concepts askable (genus concept), and the FIRST model at the edge: a local embedder for WSD + a capped, graph-verified write-path (model:embedder) -- the doorway to the companion, on the self-checking glass-box core"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "psutil>=5.9",
    "sympy>=1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
]

[project.scripts]
genus = "genus.cli:main"

[tool.setuptools]
packages = ["genus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error",
    # GC-timing noise: a file-backed sqlite connection finalized during garbage collection
    # emits an "unclosed database" ResourceWarning that pytest reports as an unraisable
    # exception. It is test-cleanup hygiene, not a product bug, and surfaces non-
    # deterministically (which test is running at GC time) -- so don't escalate it to a
    # hard failure. Everything else stays warnings-as-errors.
    "ignore::pytest.PytestUnraisableExceptionWarning",
]
