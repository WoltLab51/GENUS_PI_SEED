[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genus-pi-seed"
version = "1.13.0"
description = "GENUS PI SEED v1.13.0 - sharper self-characterization (volatility as an outlier vs the population's own spread, not a median split), experience re-characterization, learned half-life, self-reflection loop, DB hardening"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
]

[project.scripts]
genus = "genus.cli:main"

[tool.setuptools]
packages = ["genus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
